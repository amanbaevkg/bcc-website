# Local development with hot reload:
#   docker compose up --build        → website http://localhost:3000, admin http://localhost:3000/admin
# Settings: copy .env.example to .env (optional). .env is never committed.
# The admin's database and uploads are kept in apps/web/data and apps/web/media (not committed).
# Development only; the production image is the Dockerfile's last stage (see README → Deployment).

x-dev: &dev
  build:
    context: .
    target: dev
  image: bcc-web-dev
  env_file:
    - path: .env
      required: false
  volumes:
    # Your source code, live: edits on your machine reload the page.
    - .:/repo
    # Dependencies and the build cache stay inside Docker (Linux builds, never mixed with your machine's).
    - node_modules:/repo/node_modules
    - web_node_modules:/repo/apps/web/node_modules
    - next_cache:/repo/apps/web/.next

services:
  # Runs once per start: keeps the dependency volumes in step with pnpm-lock.yaml (seconds when unchanged).
  install:
    <<: *dev
    command: pnpm install --frozen-lockfile --config.confirmModulesPurge=false

  web:
    <<: *dev
    depends_on:
      install:
        condition: service_completed_successfully
    working_dir: /repo/apps/web
    command: pnpm exec next dev --hostname 0.0.0.0 --port 3000
    ports:
      - '3000:3000'
    environment:
      SITE_ENV: ${SITE_ENV:-development}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      # Development-only signing key; the live server gets its own secret value.
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-development-only-secret-0123456789}
      DATABASE_URL: ${DATABASE_URL:-file:./data/payload.db}
    restart: unless-stopped

volumes:
  node_modules:
  web_node_modules:
  next_cache:
