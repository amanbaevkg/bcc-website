# GitLab CI for bcc-web.
# Secrets belong in GitLab CI/CD variables, never in the repository.

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - build
  - e2e

variables:
  NEXT_TELEMETRY_DISABLED: '1'
  SITE_ENV: staging

# Only application jobs inherit the Node/pnpm setup.
.node-job:
  image: node:22-alpine
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  variables:
    NODE_OPTIONS: '--max-old-space-size=1024'

quality:
  extends: .node-job
  stage: test
  script:
    - pnpm format:check
    - pnpm lint
    - pnpm typecheck
    - pnpm i18n:check
    - pnpm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

audit:
  extends: .node-job
  stage: test
  script:
    - pnpm audit --prod --audit-level high
  # Keep findings visible without blocking the pipeline.
  allow_failure: true

build:
  extends: .node-job
  stage: build
  variables:
    BUILD_LOW_MEMORY: '1'
    NODE_OPTIONS: '--max-old-space-size=2048'
    KUBERNETES_MEMORY_REQUEST: '2Gi'
    KUBERNETES_MEMORY_LIMIT: '4Gi'
  script:
    - pnpm build
  artifacts:
    paths:
      - apps/web/.next/
    exclude:
      - 'apps/web/.next/cache/**/*'
      - 'apps/web/.next/standalone/**/*'
    expire_in: 1 day

e2e:
  extends: .node-job
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  needs:
    - job: build
      artifacts: true
  script:
    - pnpm --filter web exec playwright test
  artifacts:
    when: on_failure
    paths:
      - apps/web/playwright-report/
      - apps/web/test-results/
    expire_in: 7 days
